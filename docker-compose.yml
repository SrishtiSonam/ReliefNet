# ─── docker-compose.yml ───────────────────────────────────────────────────────
version: "3.9"
services:

  mongodb:
    image: mongo:6
    container_name: flood_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  fastapi:
    build: ./backend
    container_name: flood_fastapi
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=flood_relief_india
    volumes:
      - ./backend/datasets:/app/datasets
    depends_on:
      - mongodb
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  express:
    build: ./express-server
    container_name: flood_express
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/flood_relief_india
      - FASTAPI_URL=http://fastapi:8000
    depends_on:
      - mongodb
      - fastapi

  frontend:
    build: ./frontend
    container_name: flood_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - express

volumes:
  mongo_data:
